name: Visual regression

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  storybook:
    name: Storybook and interaction tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      built: ${{ steps.upload.outcome == 'success' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: node_modules/.bin/playwright install --with-deps chromium

      - name: Build Storybook
        run: yarn storybook:build

      - name: Upload Storybook
        id: upload
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static
          path: storybook-static
          include-hidden-files: true
          retention-days: 1

      - name: Interaction tests
        run: yarn test:storybook:ci

  base-storybook:
    name: Base branch Storybook
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      available: ${{ steps.build.outputs.available }}
    steps:
      - name: Checkout base branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.base_ref }}
          path: base

      - uses: actions/setup-node@v7
        with:
          node-version-file: 'base/.nvmrc'
          cache: 'yarn'
          cache-dependency-path: 'base/yarn.lock'

      - name: Install base dependencies
        working-directory: base
        run: yarn install --immutable

      - name: Build base Storybook
        id: build
        working-directory: base
        run: |
          if [ ! -x node_modules/.bin/storybook ]; then
            echo "::warning::The base branch has no Storybook; visual comparison is skipped."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node_modules/.bin/storybook build -o ../storybook-static-base --quiet
          echo "available=true" >> "$GITHUB_OUTPUT"

      - name: Upload base Storybook
        if: steps.build.outputs.available == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: storybook-static-base
          path: storybook-static-base
          include-hidden-files: true
          retention-days: 1

  visual:
    # Both Storybooks are built on Linux, but every screenshot of this pull
    # request and of its base is taken here, on one macOS runner, so the two
    # sides of the comparison always render text the same way.
    runs-on: macos-14
    needs: [storybook, base-storybook]
    if: ${{ !cancelled() && needs.storybook.outputs.built == 'true' && needs.base-storybook.outputs.available == 'true' }}
    timeout-minutes: 45
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'
          cache-dependency-path: '**/yarn.lock'

      - name: Install dependencies
        run: yarn install --immutable

      - name: Read the Playwright version
        id: playwright
        run: |
          echo "version=$(node -p "require('playwright-core/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Chromium
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}

      - name: Install Chromium
        run: node_modules/.bin/playwright install chromium

      - name: Download the base Storybook
        uses: actions/download-artifact@v8
        with:
          name: storybook-static-base
          path: storybook-static-base

      - name: Download the pull request Storybook
        uses: actions/download-artifact@v8
        with:
          name: storybook-static
          path: storybook-static

      - name: Record baselines from the base Storybook
        continue-on-error: true
        run: yarn test:visual:baseline:ci

      - name: Count baselines
        run: |
          count=$(find package/__visual__ -name '*.png' 2>/dev/null | wc -l | tr -d ' ')
          echo "Baseline images: $count"
          if [ "$count" = "0" ]; then
            echo "::warning::No baselines were recorded from the base Storybook; nothing is compared."
          fi

      - name: Compare with the base branch
        continue-on-error: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
        run: yarn test:visual:ci

      - name: List changed stories
        if: always()
        env:
          ACCEPTED: ${{ contains(github.event.pull_request.labels.*.name, 'visual-change') }}
        run: |
          diffs=$(find storybook-visual-diff -maxdepth 1 -name '*-diff.png' 2>/dev/null | sort)
          {
            echo "## Visual regression"
            if [ -z "$diffs" ]; then
              echo "No differences from the base branch."
            else
              if [ "$ACCEPTED" = "true" ]; then
                echo "Label \`visual-change\` is set: these differences are accepted and do not block the pull request."
              else
                echo "These stories differ from the base branch. Add the \`visual-change\` label if the change is intended."
              fi
              echo
              for file in $diffs; do
                echo "- \`$(basename "$file" -diff.png)\`"
              done
              echo
              echo "Diff and received images are in the \`storybook-visual-diff\` artifact."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload visual diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: storybook-visual-diff
          path: storybook-visual-diff/
          if-no-files-found: ignore
